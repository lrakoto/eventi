project_id = "Eventi"

# Gateway JWT verification rejects the project's new ES256 / sb_publishable keys
# ("Unsupported JWT algorithm ES256"), so these functions authorize themselves:
# - ingest-ticketmaster checks the x-cron-secret header (cron only)
# - ingest-for-location is public but rate-limited by claim_location_ingest
# - apple-token-exchange / delete-account validate the user's token via auth.getUser
[functions.ingest-ticketmaster]
verify_jwt = false

[functions.ingest-for-location]
verify_jwt = false

[functions.apple-token-exchange]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
