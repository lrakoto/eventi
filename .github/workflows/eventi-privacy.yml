name: Publish EventAlly privacy and support pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/eventi-privacy.yml
      - constants/privacy-policy.json
      - docs/support.html
      - scripts/build-privacy-page.mjs
  workflow_dispatch:

permissions: {}

concurrency:
  group: eventi-privacy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Stage privacy and support pages
        run: |
          node scripts/build-privacy-page.mjs
          mkdir -p "$RUNNER_TEMP/eventi-privacy/privacy" "$RUNNER_TEMP/eventi-privacy/support"
          cp docs/privacy.html "$RUNNER_TEMP/eventi-privacy/index.html"
          cp docs/privacy.html "$RUNNER_TEMP/eventi-privacy/privacy/index.html"
          cp docs/support.html "$RUNNER_TEMP/eventi-privacy/support/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/eventi-privacy

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
